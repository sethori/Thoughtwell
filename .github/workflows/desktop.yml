name: Desktop build

# Builds a self-contained Linux AppImage (its own database, API and web app) and
# smoke-tests it. Run it from the Actions tab ("Run workflow"), then download the
# AppImage from the run's Artifacts. Pushing a tag like desktop-v0.1.0 also runs it.
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The AppImage ships this PostgreSQL build, so the runner's copy is what gets bundled.
      - name: Install PostgreSQL 16 and Electron's runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 xvfb libnss3 libgbm1 libgtk-3-0t64 libasound2t64
          sudo systemctl stop postgresql || true

      - run: pnpm install ${{ hashFiles('pnpm-lock.yaml') != '' && '--frozen-lockfile' || '' }}
      - run: pnpm typecheck
      - run: pnpm desktop:package

      # Starts the real AppImage on a virtual display, creates a database, signs in
      # through the API and checks the web app is served. Fails the run if any of it breaks.
      - name: Smoke test the AppImage
        working-directory: apps/desktop/release
        run: |
          chmod +x Thoughtwell-*.AppImage
          xvfb-run -a ./Thoughtwell-*.AppImage --appimage-extract-and-run --smoke 2>&1 | tee smoke.log
          grep -q "SMOKE OK" smoke.log

      - uses: actions/upload-artifact@v4
        with:
          name: Thoughtwell-AppImage
          path: apps/desktop/release/Thoughtwell-*.AppImage
          if-no-files-found: error
