# Home-server deployment. Copy .env.example to .env first.
# Your existing nginx terminates TLS on your subdomain and proxies to WEB_PORT.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # PGDATA_DIR is a volume name by default, or an absolute path for a bind mount (Unraid).
      - ${PGDATA_DIR:-pgdata}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 20

  # Runs migrations, then exits. The API waits for it.
  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["pnpm", "exec", "tsx", "src/migrate.ts"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      # Used only by the one-time seed: docker compose run --rm migrate pnpm exec tsx src/seed.ts
      SEED_ORG_NAME: ${SEED_ORG_NAME:-My Organization}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_DISPLAY_NAME: ${SEED_ADMIN_DISPLAY_NAME:-Administrator}
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    environment:
      APP_DATABASE_URL: postgres://notes_app:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      SESSION_SECRET: ${SESSION_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      STORAGE_DIR: /data/assets
      API_PORT: 3000
    volumes:
      - ${ASSETS_DIR:-assets}:/data/assets
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      retries: 10

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  assets:
